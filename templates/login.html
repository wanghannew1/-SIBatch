<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 参保信息收集系统</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; }
  </style>
</head>
<body class="bg-light">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body p-4">
          <h4 class="text-center mb-4">参保信息收集系统</h4>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'message' else 'danger' }}">
                  {{ message }}
                </div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post" action="/login">
            <div class="mb-3">
              <label class="form-label" for="username">用户名</label>
              <input class="form-control" id="username" name="username"
                     required autofocus autocomplete="username">
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">密码</label>
              <input class="form-control" id="password" name="password"
                     type="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary w-100" type="submit">登录</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
